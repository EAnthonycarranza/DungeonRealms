<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Dungeon Realms - a colorful 2.5D isometric action RPG">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="theme-color" content="#080b12">
  <meta name="apple-mobile-web-app-title" content="Dungeon Realms">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Dungeon Realms</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body { margin: 0; height: 100%; background: #080b12; }
    /* Shown while the engine downloads; hidden once Flutter attaches its view. */
    #splash {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 18px;
      font: 900 clamp(28px, 6vw, 56px)/1 system-ui, sans-serif; letter-spacing: 2px;
      color: #ffc94f; text-shadow: 0 4px 24px rgba(255, 138, 43, .35);
    }
    #splash small { font: 700 13px/1 system-ui, sans-serif; letter-spacing: 3px; color: #aeb7c7; }
    body:has(flutter-view) #splash { display: none; }
  </style>
</head>
<body>
  <div id="splash">DUNGEON REALMS<small>SHARPENING ARROWS…</small></div>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
